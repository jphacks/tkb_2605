# Production on the jphack-workout VM (512MB): images are built by GitHub Actions and pulled, never built here.
# Run through ops/*.sh, which pass --env-file /srv/workout/.env. See README "本番運用".
name: workout
services:
  web:
    image: ghcr.io/reindeer39/kintore-app-web:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 32m
    # no published ports: only cloudflared (same network) reaches it

  backend:
    image: ghcr.io/reindeer39/kintore-app-backend:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${PUBLIC_HOST:?set PUBLIC_HOST},backend,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${PUBLIC_HOST}
      SQLITE_PATH: /data/db.sqlite3
      # migrations run explicitly from ops/deploy.sh after a backup
      SKIP_MIGRATE: "1"
    volumes:
      - ${DATA_DIR:-/srv/workout/data}:/data
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Remotely managed tunnel; its public hostname points at http://web:8080.
      # The same token on any Docker host serves the same URL (see README "自宅外への移行").
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN}
    depends_on:
      - web
    mem_limit: 64m
