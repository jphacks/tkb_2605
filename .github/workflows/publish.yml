name: Publish images
# Pushes the production images to GHCR, tagged with the commit SHA and "latest", after CI passed on main.
# The VM deploys them by itself (ops/auto-deploy.sh, every 5 minutes) or by hand with ops/deploy.sh <sha>.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # only CI runs triggered by a push to main (not PRs from a branch named main)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    strategy:
      matrix:
        include:
          - name: web
            context: frontend
          - name: backend
            context: backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: prod
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ env.SHA }}
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:latest
          labels: org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
